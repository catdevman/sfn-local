name: Sync AWS Step Functions spec snapshots

on:
  schedule:
    # Daily at 13:17 UTC. GitHub Actions polls; it cannot subscribe to RSS.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aws-spec-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch AWS Step Functions sources
        run: |
          set -euo pipefail
          python3 aws-spec/tools/sync_aws_spec.py | tee /tmp/aws-spec-sync.txt

      - name: Regenerate Go from the snapshots
        run: |
          set -euo pipefail
          go generate ./...

      - name: Open a pull request when snapshots change
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! git status --porcelain | grep -q .; then
            echo "No AWS spec changes."
            exit 0
          fi

          python3 aws-spec/tools/sync_commit_guard.py --porcelain

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- aws-spec internal/api/gen internal/asl/specgen
          python3 aws-spec/tools/sync_commit_guard.py --cached

          if ! git diff --cached --name-only | grep -q .; then
            echo "No committable snapshot changes."
            exit 0
          fi

          python3 aws-spec/tools/summarize_generated_diff.py --from-git > /tmp/generated-diff.md

          git commit -m "Update AWS Step Functions spec snapshots" -m "Fetched the AWS snapshots and regenerated the Go surface. The bot does not edit handlers, docs/spec.md, surface.toml, or catalog.toml."

          branch="aws-spec/sync"
          if git ls-remote --exit-code origin "$branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            git push --force-with-lease origin "HEAD:${branch}"
          else
            git push origin "HEAD:${branch}"
          fi

          {
            echo "## AWS spec snapshots"
            echo
            echo "The fetch ran, then \`go generate ./...\`. The bot commits only \`aws-spec/**\`, \`internal/api/gen/**\`, and \`internal/asl/specgen/**\`."
            echo "It does not edit handlers, \`docs/spec.md\`, \`surface.toml\`, or \`catalog.toml\`."
            echo
            echo '```'
            cat /tmp/aws-spec-sync.txt
            echo '```'
            echo
            cat /tmp/generated-diff.md
          } > /tmp/aws-spec-pr.md

          existing="$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "Update AWS Step Functions spec snapshots" --body-file /tmp/aws-spec-pr.md
          else
            gh pr comment "$existing" --body-file /tmp/aws-spec-pr.md
          fi
