version: 2

project_name: sfnlocal

before:
  hooks:
    - go mod tidy

builds:
  - id: sfnlocal
    main: ./cmd/sfnlocal
    binary: sfnlocal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: sfnlocal
    ids:
      - sfnlocal
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

brews:
  - name: sfnlocal
    ids:
      - sfnlocal
    directory: Formula
    repository:
      owner: catdevman
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/catdevman/sfn-local"
    description: "Local AWS Step Functions server"
    license: "Apache-2.0"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: catdevman
    name: sfn-local
  draft: false
  prerelease: auto
